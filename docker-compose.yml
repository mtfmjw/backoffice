services:
  db:
    image: postgres:18-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: backoffice
      POSTGRES_USER: backoffice
      POSTGRES_PASSWORD: P09olp09ol
    volumes:
      - ./init/db_backup.dump:/backup.dump
      - postgres_data:/var/lib/postgresql
    command: >
      sh -c "docker-entrypoint.sh postgres &
             until pg_isready -U backoffice; do sleep 1; done;
             pg_restore -U backoffice -d backoffice /backup.dump || true;
             wait"

  web:
    build: .
    container_name: django_web
    restart: always
    volumes:
      - .:/app
      - static_volume:/app/staticfiles  # Mount shared volume for static files
    environment:
      - DB_NAME=backoffice
      - DB_USER=backoffice
      - DB_PASSWORD=P09olp09ol
      - DB_HOST=db
      - DB_PORT=5432
      - DEBUG=False
      - ALLOWED_HOSTS=*
    depends_on:
      - db
    # Expose internally to Nginx only (remove external port mapping)
    expose:
      - "8000"
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 backoffice.wsgi:application"

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume: