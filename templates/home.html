<!DOCTYPE html>
<html lang="en">

<body>
    <div class="card">
        <h1>Backoffice</h1>
        {% if user.is_authenticated %}
            <p>Welcome, {{ user.username }}!</p>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Log out</button>
            </form>
        {% else %}
            <p class="small">You are not logged in.</p>
            <a class="button" href="{% url 'login' %}">Log in</a>
        {% endif %}
    </div>
</body>
</html>
