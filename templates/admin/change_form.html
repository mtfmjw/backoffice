{% extends "admin/change_form.html" %}
{% load i18n admin_urls static %}

{% block extrahead %}
  {{ block.super }}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const validFlag = {% if original and original.valid_flag is not None %}{{ original.valid_flag|lower }}{% else %}true{% endif %};
      const deleteButton = document.querySelector('a[href$="/delete/"]');
      if (deleteButton && !validFlag) {
        deleteButton.textContent = '{% trans "Restore" %}';
      }
    });
  </script>
{% endblock %}
